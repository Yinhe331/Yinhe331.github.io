<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Luxury Tree</title>
    <script>
        // 设备识别：手机/平板(竖屏触屏) → 优化版；电脑(横屏鼠标) → 原版
        (function () {
            var ua = navigator.userAgent || '';
            var isMobileUA = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua);
            var isTouchTablet = false;
            try {
                isTouchTablet = window.matchMedia('(pointer: coarse)').matches
                    && window.matchMedia('(hover: none)').matches;
            } catch (e) { }
            var smallScreen = Math.min(window.screen.width, window.screen.height) <= 500;
            var isMobile = isMobileUA || isTouchTablet || smallScreen;
            location.replace(isMobile ? 'mobile.html' : 'pc.html');
        })();
    </script>
    <style>
        body { background: #020205; margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        p { color: #d4af37; font-size: 14px; letter-spacing: .2em; }
        a { color: #d4af37; }
    </style>
    <noscript><meta http-equiv="refresh" content="0; url=pc.html"></noscript>
</head>
<body>
    <noscript>
        <p><a href="pc.html">电脑版</a> ｜ <a href="mobile.html">手机版</a></p>
    </noscript>
</body>
</html>
