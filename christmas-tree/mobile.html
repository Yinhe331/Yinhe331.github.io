<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020205">
    <title>Luxury Tree - Custom Edition</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Ma+Shan+Zheng&display=swap">

    <style>
        html, body { height: 100%; }
        body {
            margin: 0; overflow: hidden; background-color: #020205;
            font-family: 'Cinzel', serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container { position: fixed; inset: 0; z-index: 1; }
        #canvas-container canvas { display: block; }

        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.3) 100%); }

        #main-title {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: clamp(30px, 6.5vw, 80px);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            min-height: 1.2em;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(180deg, #fffdf0 0%, #eacda3 30%, #d6ae7b 60%, #8b6c42 100%);
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6));
            animation: titleFadeIn 2s ease-out forwards 1s;
            transition: filter 1.5s ease;
        }

        @keyframes titleFadeIn {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        #loader { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; transition: opacity 1.2s; pointer-events: none; }
        .spinner { width: 40px; height: 40px; border: 2px solid rgba(212, 175, 55, 0.1); border-top: 2px solid #d4af37; border-radius: 50%; animation: spin 1s linear infinite; }
        #loader p { color: rgba(212,175,55,.55); font-size: 12px; letter-spacing: .3em; margin: 0; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #fatal { position: fixed; inset: 0; z-index: 120; background: #000; color: #d4af37; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font-family: sans-serif; font-size: 15px; line-height: 1.8; }

        /* ---------- 控制面板（桌面端） ---------- */
        #top-right-controls { position: absolute; top: 20px; right: 20px; z-index: 30; display: flex; flex-direction: row; gap: 15px; pointer-events: auto; }
        .control-col { display: flex; flex-direction: column; gap: 15px; }

        .control-btn {
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37; width: 100px; padding: 5px 0; border-radius: 7px;
            font-family: 'Cinzel', serif; font-size: 14px; font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .control-btn:hover { background: rgba(212, 175, 55, 0.2); border-color: rgba(212, 175, 55, 0.8); color: #fff; transform: scale(1.05); }
        .control-btn:active { transform: scale(0.95); }
        .control-btn.disabled { color: #666; border-color: #444; cursor: not-allowed; }

        /* ---------- 移动端：悬浮菜单按钮 + 折叠面板 ---------- */
        #menu-toggle {
            display: none;
            position: absolute; top: 14px; right: 14px; z-index: 40;
            width: 46px; height: 46px;
            align-items: center; justify-content: center;
            background: rgba(10, 10, 10, 0.65);
            border: 1px solid rgba(212, 175, 55, 0.45);
            color: #d4af37; border-radius: 12px; font-size: 20px;
            cursor: pointer; pointer-events: auto;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            transition: all 0.25s ease;
        }
        #menu-toggle:active { transform: scale(0.92); }

        #file-input, #music-input, #import-input { display: none; }

        #webcam-wrapper { position: absolute; bottom: 20px; right: 20px; opacity: 0; pointer-events: none; border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 4px; background: #000; z-index: 50; display: flex; transition: opacity 0.5s; }
        #webcam { display: none; }
        #webcam-preview { width: 100%; height: 100%; transform: scaleX(-1); }

        #letter-editor-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(86vw, 500px); background: rgba(10, 10, 10, 0.95); border: 1px solid #d4af37; border-radius: 10px; padding: 20px; z-index: 200; display: none; flex-direction: column; gap: 15px; pointer-events: auto; }
        #letter-editor-modal h3 { color: #d4af37; margin: 0; text-align: center; }
        #letter-text-input { width: 100%; box-sizing: border-box; height: 150px; background: rgba(255,255,255,0.05); border: 1px solid #444; color: #fff; padding: 10px; resize: none; outline: none; font-size: 16px; font-family: inherit; }
        .modal-btn-group { display: flex; justify-content: flex-end; gap: 10px; }

        #letter-overlay { position: absolute; inset: 0; z-index: 150; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; pointer-events: auto; opacity: 0; transition: opacity 1.5s ease; }
        .letter-paper {
            height: 80%; aspect-ratio: 3/4;
            background: rgba(255, 252, 240, 0.15);
            backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: clamp(18px, 6vh, 52px);
            box-sizing: border-box; position: relative;
            display: flex; flex-direction: column;
            transform: translateY(20px); transition: transform 1.5s ease-out;
        }
        .letter-content {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(15px, 2.3vh, 24px); line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 5px rgba(255,215,0, 0.3);
            white-space: pre-wrap; overflow-y: auto; flex: 1;
            scroll-behavior: smooth;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .letter-content::-webkit-scrollbar { width: 6px; }
        .letter-content::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 3px; }
        .cursor::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .letter-close-btn { position: absolute; top: 15px; right: 15px; width: 34px; height: 34px; border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; font-size: 16px; }
        .letter-close-btn:hover { background: rgba(255,255,255,0.2); color: #fff; border-color: #fff; }

        #toast { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); max-width: 82vw; background: rgba(10,10,10,.82); border: 1px solid rgba(212,175,55,.5); color: #d4af37; padding: 10px 24px; border-radius: 22px; font-size: 13px; letter-spacing: .12em; z-index: 300; opacity: 0; transition: opacity .4s; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #gesture-status { position: absolute; bottom: 10px; left: 10px; z-index: 55; color: rgba(212,175,55,.9); font-size: 11px; letter-spacing: .08em; background: rgba(0,0,0,.5); padding: 4px 10px; border-radius: 10px; pointer-events: none; display: none; white-space: nowrap; }

        /* ---------- 手势互动入口 ---------- */
        #gesture-cta {
            position: absolute;
            bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            left: 50%; transform: translateX(-50%);
            z-index: 60; pointer-events: auto;
            display: flex; align-items: center; gap: 10px;
            background: rgba(10, 10, 10, 0.68);
            border: 1px solid rgba(212, 175, 55, 0.55);
            color: #d4af37;
            font-family: 'Cinzel', serif; font-size: 15px; font-weight: 600; letter-spacing: .15em;
            white-space: nowrap;
            padding: 13px 28px; border-radius: 28px;
            cursor: pointer;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: opacity .5s ease, background .3s ease, color .3s ease;
            animation: ctaPulse 2.6s ease-in-out infinite;
        }
        #gesture-cta .cta-icon { font-size: 18px; }
        #gesture-cta:hover { background: rgba(212, 175, 55, 0.2); color: #fff; }
        #gesture-cta:active { transform: translateX(-50%) scale(0.96); }
        #gesture-cta.hidden { opacity: 0; pointer-events: none; }
        @keyframes ctaPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.35); }
            50% { box-shadow: 0 0 20px 5px rgba(212, 175, 55, 0.22); }
        }

        /* ---------- 移动端适配 ---------- */
        @media (max-width: 768px) {
            #menu-toggle { display: flex; }

            #top-right-controls {
                top: 72px; right: 14px;
                gap: 10px;
                background: rgba(6, 6, 10, 0.9);
                border: 1px solid rgba(212, 175, 55, 0.35);
                border-radius: 14px;
                padding: 14px;
                opacity: 0; pointer-events: none;
                transform: translateY(-8px) scale(0.96);
                transform-origin: top right;
                transition: all 0.25s ease;
                backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
                box-shadow: 0 8px 32px rgba(0,0,0,.6);
            }
            body.menu-open #top-right-controls { opacity: 1; pointer-events: auto; transform: none; }
            .control-col { gap: 10px; }
            .control-btn { width: 112px; padding: 10px 0; font-size: 13px; }

            #main-title { top: 7%; font-size: clamp(24px, 8.5vw, 44px); }

            .letter-paper { width: min(90vw, 58vh); height: auto; max-height: 80%; }

            #webcam-wrapper { bottom: 14px; right: 14px; }
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>

<body>
    <div id="loader"><div class="spinner"></div><p>LOADING</p></div>
    <div id="fatal"><div>当前浏览器不支持 WebGL / 新版 JavaScript 特性<br>请使用较新的 Chrome / Safari / Edge 打开本页面</div></div>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="main-title"></div>

        <button id="menu-toggle" aria-label="菜单">☰</button>

        <div id="top-right-controls">
            <div class="control-col" id="col-media">
                <button id="btn-bg-music" class="control-btn">上传音乐</button>
                <button id="btn-add-photo" class="control-btn">上传照片</button>
                <button id="btn-write-letter" class="control-btn">上传书信</button>
                <button id="btn-set-title" class="control-btn">设置标题</button>
            </div>
            <div class="control-col" id="col-system">
                <button id="btn-import" class="control-btn">导入网页</button>
                <button id="btn-export" class="control-btn">导出网页</button>
                <button id="btn-fullscreen" class="control-btn">全屏显示</button>
                <button id="btn-switch-theme" class="control-btn">颜色切换</button>
            </div>
        </div>
        <input type="file" id="file-input" multiple accept="image/*">
        <input type="file" id="music-input" accept="audio/mp3,audio/*">
        <input type="file" id="import-input" accept=".json">
    </div>

    <div id="letter-editor-modal">
        <h3>撰写你的心意</h3>
        <textarea id="letter-text-input" placeholder="在这里写下你想说的话..."></textarea>
        <div class="modal-btn-group">
            <button id="btn-cancel-letter" class="control-btn" style="width: 80px;">取消</button>
            <button id="btn-save-letter" class="control-btn" style="width: 80px;">保存</button>
        </div>
    </div>

    <div id="letter-overlay">
        <div class="letter-paper">
            <div class="letter-close-btn" id="btn-close-letter-mode">×</div>
            <div class="letter-content" id="letter-content-display"></div>
        </div>
    </div>

    <div id="webcam-wrapper">
        <video id="webcam" autoplay playsinline webkit-playsinline></video>
        <canvas id="webcam-preview"></canvas>
    </div>

    <!-- 手势互动入口：点击时主动申请摄像头权限（浏览器要求用户操作后才会弹权限窗） -->
    <button id="gesture-cta"><span class="cta-icon">✋</span>开启手势互动</button>

    <div id="toast"></div>
    <div id="gesture-status"></div>

    <audio id="bg-music" loop crossorigin="anonymous"></audio>

    <script>
        // 全局错误捕获（诊断用）
        window.__errs = [];
        window.addEventListener('error', e => {
            window.__errs.push((e.message || 'unknown') + ' @ ' + (e.filename || '') + ':' + e.lineno + ':' + e.colno);
        });
        window.addEventListener('unhandledrejection', e => {
            window.__errs.push('rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
        });

        // 老浏览器（不支持 importmap）给出友好提示，而不是白屏
        if (!(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
            document.getElementById('fatal').style.display = 'flex';
            document.getElementById('loader').style.display = 'none';
        }
        // CDN 加载失败兜底提示
        setTimeout(function () {
            if (!window.__xtreeReady) {
                var f = document.getElementById('fatal');
                if (f.style.display !== 'flex') {
                    f.style.display = 'flex';
                    f.querySelector('div').innerHTML = '资源加载超时，请检查网络后刷新重试<br>（页面依赖 jsDelivr / Google Fonts CDN）';
                    var l = document.getElementById('loader');
                    if (l) l.style.display = 'none';
                }
            }
        }, 15000);
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        /* ================================================================
         * 设备适配：粒子数量/画质全平台一致（InstancedMesh + GPU 粒子足够快），
         * 仅交互方式与 UI 布局随设备变化；性能不足时靠帧率自适应降像素比兜底
         * ================================================================ */
        const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
        const IS_MOBILE = IS_TOUCH || window.innerWidth < 768;

        const CONFIG = {
            colors: {
                bg: 0x020205, gold: 0xffd700, red: 0x880000, green: 0x004400,
                iceBlue: 0xaaddff,
                iceCyan: 0x00ffff,
                iceMagenta: 0xff00cc,
                iceDeep: 0x002244,
                white: 0xffffff,
                barbieHot: 0xff1694,
                barbieSoft: 0xffb7c5,
                barbieViolet: 0xd461e3
            },
            particles: {
                count: 2600, dustCount: 2200, sparkleCount: 380,
                treeHeight: 28, treeRadius: 9,
                snowCount: 2600, snowSpeed: 10, galaxyCount: 3800, heartCount: 1600
            },
            camera: { baseZ: 55, minZoom: 0.55, maxZoom: 1.9 },
            gestures: { palmOpenThreshold: 0.35, sensitivity: 6.0 }
        };

        const STATE = {
            mode: 'TREE', focusTarget: null, currentPhotoIndex: -1,
            currentThemeIndex: 0,
            gestureDebounceTimer: 0,
            isGestureSwitchEnabled: true,
            scatterScale: 1.0, gestureBaseSpread: null,
            hand: { detected: false, x: 0, y: 0 },
            rotation: { x: 0, y: 0 }, spinVel: { x: 0, y: 0 }, time: 0,
            wasPointing: false, palmCenter: { x: 0.5, y: 0.5 }, hasPalmCenter: false,
            starMesh: null, starHaloMesh: null,
            letterContent: "",
            letterTyper: null, letterStartTimer: null, letterLastTriggerTime: 0,
            musicData: null,
            // 触控/缩放
            zoom: 1, zoomTarget: 1, dragSpin: 0, userTiltUntil: 0, _lastDragT: 0,
            firstHandSeen: false,
        };

        let scene, camera, renderer, composer, clock = new THREE.Clock();
        let mainGroup, starGroup, bgGroup, photoMeshGroup;
        let galaxySystem = null, snowSystem = null, heartSystem = null;
        let dustSys = null, sparkleSys = null;
        let treeSystems = [];
        let photoParticles = [];

        let handLandmarker, video, drawingUtils, canvasCtx;
        let texLib = {}, matLib = {};
        let DPR_CAP = Math.min(window.devicePixelRatio || 1, 2);
        let _lastW = 0, _lastH = 0;

        const _tempVec = new THREE.Vector3();
        const _targetVec = new THREE.Vector3();
        const _invMatrix = new THREE.Matrix4();
        const _dummyP = new THREE.Vector3();
        const _dummyQ = new THREE.Quaternion();
        const _dummyS = new THREE.Vector3();
        const _dummyM = new THREE.Matrix4();

        /* ================================================================
         * 初始化
         * ================================================================ */
        async function init() {
            try {
                initThree();
                setupEnvironment();
                setupLights();
                createTextures();
                createMaterials();

                createGalaxyBackground();
                createFallSystems();
                createDustAndSparkles();
                createTreeParticles();
                createStarTopper();

                setupPostProcessing();
                setupEvents();
                setupLetterSystem();

                switchTheme(0);
                onResize();
                bakeBaseOpacity();

                // 手势识别由底部"开启手势互动"按钮触发（浏览器要求用户操作后才会弹摄像头权限窗）

                window.__xtreeReady = true;
                const loader = document.getElementById('loader');
                loader.style.opacity = 0;
                setTimeout(() => loader.remove(), 1200);

                animate();
            } catch (error) {
                console.error('初始化失败:', error);
                const fatal = document.getElementById('fatal');
                fatal.style.display = 'flex';
                const loader = document.getElementById('loader');
                if (loader) loader.style.display = 'none';
            }
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.bg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.012);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, CONFIG.camera.baseZ);

            renderer = new THREE.WebGLRenderer({
                antialias: false, // 走 EffectComposer 的 MSAA
                powerPreference: "high-performance",
                depth: true,
                alpha: false,
                stencil: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(DPR_CAP);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            bgGroup = new THREE.Group(); scene.add(bgGroup);
            mainGroup = new THREE.Group(); mainGroup.rotation.x = 0.1; scene.add(mainGroup);
            starGroup = new THREE.Group(); mainGroup.add(starGroup);
            photoMeshGroup = new THREE.Group(); mainGroup.add(photoMeshGroup);
        }

        function setupEnvironment() {
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.2));
            const bottomLight = new THREE.PointLight(CONFIG.colors.gold, 3, 40);
            bottomLight.position.set(0, -10, 10);
            mainGroup.add(bottomLight);

            const spotGold = new THREE.SpotLight(0xfff0dd, 800);
            spotGold.position.set(40, 60, 40); spotGold.angle = 0.4; spotGold.decay = 2;
            scene.add(spotGold);

            const spotBlue = new THREE.SpotLight(0x4455ff, 400);
            spotBlue.position.set(-40, 10, -30); spotBlue.lookAt(0, 0, 0);
            scene.add(spotBlue);
        }

        function setupPostProcessing() {
            // 全平台开启 4x MSAA，画面边缘更干净
            const size = renderer.getDrawingBufferSize(new THREE.Vector2());
            const rt = new THREE.WebGLRenderTarget(size.x, size.y, {
                samples: 4,
                type: THREE.HalfFloatType
            });
            composer = new EffectComposer(renderer, rt);

            const bloom = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, 0.4, 0.85
            );
            bloom.threshold = 0.75;
            bloom.strength = 0.5;
            bloom.radius = 0.5;

            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(bloom);
        }

        /* ================================================================
         * 纹理（全部本地 Canvas 生成，无外部图片依赖，国内加载更快）
         * ================================================================ */
        function makeCanvasTexture(size, draw) {
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            draw(canvas.getContext('2d'), size);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        function createTextures() {
            // 柔光圆点（尘埃 / 雪花 / 星球背景）
            texLib.glow = makeCanvasTexture(128, (ctx, s) => {
                const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
                g.addColorStop(0, 'rgba(255,255,255,1)');
                g.addColorStop(0.22, 'rgba(255,255,255,0.65)');
                g.addColorStop(0.55, 'rgba(255,255,255,0.16)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
            });

            // 四芒星光（高光闪烁粒子）
            texLib.star = makeCanvasTexture(128, (ctx) => {
                const ray = (angle, len, w, alpha) => {
                    ctx.save(); ctx.translate(64, 64); ctx.rotate(angle); ctx.scale(1, w);
                    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, len);
                    g.addColorStop(0, `rgba(255,255,255,${alpha})`);
                    g.addColorStop(0.4, `rgba(255,255,255,${alpha * 0.45})`);
                    g.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, len, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                };
                ray(0, 62, 0.10, 0.95); ray(Math.PI / 2, 62, 0.10, 0.95);
                ray(Math.PI / 4, 34, 0.15, 0.55); ray(-Math.PI / 4, 34, 0.15, 0.55);
                const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 15);
                g.addColorStop(0, 'rgba(255,255,255,1)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(64, 64, 15, 0, Math.PI * 2); ctx.fill();
            });

            // 心形
            texLib.heart = makeCanvasTexture(64, (ctx) => {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(32, 20);
                ctx.bezierCurveTo(32, 17, 30, 10, 20, 10);
                ctx.bezierCurveTo(10, 10, 10, 25, 10, 25);
                ctx.bezierCurveTo(10, 35, 20, 42, 32, 55);
                ctx.bezierCurveTo(44, 42, 54, 35, 54, 25);
                ctx.bezierCurveTo(54, 25, 54, 10, 44, 10);
                ctx.bezierCurveTo(36, 10, 32, 17, 32, 20);
                ctx.fill();
            });

            // 拐杖糖条纹
            texLib.cane = makeCanvasTexture(128, (ctx) => {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 128, 128);
                ctx.fillStyle = '#aa0000'; ctx.beginPath();
                for (let i = -128; i < 256; i += 32) {
                    ctx.moveTo(i, 0); ctx.lineTo(i + 32, 128); ctx.lineTo(i + 16, 128); ctx.lineTo(i - 16, 0);
                }
                ctx.fill();
            });
            texLib.cane.wrapS = THREE.RepeatWrapping; texLib.cane.wrapT = THREE.RepeatWrapping;
            texLib.cane.repeat.set(3, 3);
        }

        /* ================================================================
         * 材质：树身粒子附加"逐实例闪烁"着色器（原来只能整体同步闪）
         * ================================================================ */
        const uTimeUniform = { value: 0 };

        function enhanceTwinkle(mat) {
            mat.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = uTimeUniform;
                shader.vertexShader =
                    'attribute float aPhase;\nattribute float aGlow;\nvarying float vPhase;\nvarying float vGlow;\n' +
                    shader.vertexShader.replace(
                        '#include <begin_vertex>',
                        '#include <begin_vertex>\n\tvPhase = aPhase;\n\tvGlow = aGlow;'
                    );
                shader.fragmentShader =
                    'uniform float uTime;\nvarying float vPhase;\nvarying float vGlow;\n' +
                    shader.fragmentShader.replace(
                        '#include <emissivemap_fragment>',
                        `#include <emissivemap_fragment>
                        {
                            float tw = sin(uTime * 2.0 + vPhase);
                            float k = tw > 0.5 ? (1.0 + (tw - 0.5) * 2.4) : 0.42;
                            totalEmissiveRadiance *= k * (0.75 + 0.5 * vGlow);
                        }`
                    );
            };
            mat.customProgramCacheKey = () => 'xtree-twinkle-v1';
            return mat;
        }

        function createMaterials() {
            matLib.gold = enhanceTwinkle(new THREE.MeshStandardMaterial({

            matLib.ice = enhanceTwinkle(new THREE.MeshPhysicalMaterial({

            matLib.frozenMagenta = enhanceTwinkle(new THREE.MeshPhysicalMaterial({

            }));
            matLib.snow = enhanceTwinkle(new THREE.MeshStandardMaterial({
                color: 0xffffff, metalness: 0.1, roughness: 0.8,
                emissive: 0xaaaaaa, emissiveIntensity: 0.8
            }));

            matLib.barbieMain = enhanceTwinkle(new THREE.MeshPhysicalMaterial({
                color: CONFIG.colors.barbieHot, metalness: 0.2, roughness: 0.1,
                clearcoat: 1.0, emissive: 0x440022, emissiveIntensity: 0.3
            }));
            matLib.barbieSoft = enhanceTwinkle(new THREE.MeshStandardMaterial({

            }));
            matLib.pearl = enhanceTwinkle(new THREE.MeshPhysicalMaterial({
                color: 0xffffff, metalness: 0.9, roughness: 0.1,

            }));

            // 星星材质（不闪烁，靠缩放呼吸）
            matLib.starGold = new THREE.MeshStandardMaterial({
                color: 0xffdd88, emissive: 0xffaa00, emissiveIntensity: 2.0, metalness: 1.0, roughness: 0
            });
            matLib.starIce = new THREE.MeshPhysicalMaterial({
                color: CONFIG.colors.iceCyan, emissive: 0xffffff, emissiveIntensity: 3.0,
                metalness: 0.2, roughness: 0, transmission: 0.6, thickness: 3.0
            });
            matLib.starBarbie = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.barbieHot, emissive: 0xff0088, emissiveIntensity: 4.0,
                metalness: 0.5, roughness: 0.1
            });

            // 照片相框（克隆版，不参与逐实例闪烁：相框几何体没有 aPhase 属性）
            matLib.frameGold = matLib.gold.clone();
            matLib.frameIce = matLib.ice.clone();
            matLib.frameBarbie = matLib.barbieMain.clone();
            [matLib.frameGold, matLib.frameIce, matLib.frameBarbie].forEach(m => {
                m.onBeforeCompile = function () { };
                m.customProgramCacheKey = () => 'xtree-frame';
            });

            matLib.snowBorder = new THREE.MeshBasicMaterial({

            });

            // 主题 → 树身粒子材质映射
            matLib.themeMap = {
                BOX:         [matLib.green, matLib.ice, matLib.barbieSoft],
                GOLD_BOX:    [matLib.gold, matLib.ice, matLib.barbieMain],
                GOLD_SPHERE: [matLib.gold, matLib.frozenCyan, matLib.barbieMain],
                RED:         [matLib.red, matLib.frozenMagenta, matLib.pearl],
                CANE:        [matLib.candy, matLib.snow, matLib.barbieMain]

        }

        /* ================================================================
         * 圣诞树位置生成（双螺旋彩带 + 偏表层的蓬松填充）
         * ================================================================ */
        function treeSurfacePos(out) {
            const h = CONFIG.particles.treeHeight, R = CONFIG.particles.treeRadius;
            const t = Math.random();
            const angle = t * Math.PI * 12 + (Math.random() < 0.5 ? Math.PI : 0); // 双股螺旋
            const r = R * (1.0 - t) + 0.15 + (Math.random() - 0.5) * 0.3;
            out.set(Math.cos(angle) * r, t * h - h / 2, Math.sin(angle) * r);
            return out;
        }

        function treeFillPos(out) {
            const h = CONFIG.particles.treeHeight, R = CONFIG.particles.treeRadius;
            const t = Math.pow(Math.random(), 0.8);
            const rBase = Math.max(0.4, R * (1.0 - t));
            const r = rBase * Math.pow(Math.random(), 0.35); // 偏向表层，轮廓更蓬松
            const a = Math.random() * Math.PI * 2;
            out.set(Math.cos(a) * r, t * h - h / 2, Math.sin(a) * r);
            return out;
        }

        function scatterPos(out, minR, maxR) {
            const r = minR + Math.random() * (maxR - minR);
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            out.set(r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph));
            return out;
        }

        /* ================================================================
         * 树身粒子：InstancedMesh（5 个 draw call 取代原来的 ~2200 个 Mesh）
         * ================================================================ */
        function createTreeParticles() {
            const total = CONFIG.particles.count;
            const caneCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.5, 0),
                new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.1, 0.5, 0),
                new THREE.Vector3(0.3, 0.4, 0)
            ]);
            const defs = [
                // 圆角立方体 / 高分段球体 / 高分段拐杖糖：近看更精致
                { type: 'BOX',         frac: 0.35, geo: () => new RoundedBoxGeometry(0.45, 0.45, 0.45, 3, 0.09) },
                { type: 'GOLD_BOX',    frac: 0.35, geo: () => new RoundedBoxGeometry(0.45, 0.45, 0.45, 3, 0.09) },
                { type: 'GOLD_SPHERE', frac: 0.20, geo: () => new THREE.SphereGeometry(0.5, 24, 24) },
                { type: 'RED',         frac: 0.06, geo: () => new THREE.SphereGeometry(0.5, 24, 16) },
                { type: 'CANE',        frac: 0.04, geo: () => new THREE.TubeGeometry(caneCurve, 12, 0.08, 8, false) },
            ];

            for (const d of defs) {
                const n = Math.max(1, Math.round(total * d.frac));
                const geo = d.geo();
                const phases = new Float32Array(n), glows = new Float32Array(n);
                const parts = [];

                for (let i = 0; i < n; i++) {
                    phases[i] = Math.random() * Math.PI * 2;
                    glows[i] = Math.random();

                    const tmp = new THREE.Vector3();
                    // 彩球/拐杖糖更偏向挂在表面螺旋上
                    if (Math.random() < 0.3 || ((d.type === 'RED' || d.type === 'CANE') && Math.random() < 0.5)) {
                        treeSurfacePos(tmp);
                    } else {
                        treeFillPos(tmp);
                    }
                    const tree = tmp.clone();
                    const scatter = scatterPos(new THREE.Vector3(), 10, 25);
                    const quat = new THREE.Quaternion().setFromEuler(
                        new THREE.Euler(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28)
                    );
                    const baseScale = 0.4 + Math.random() * 0.4;
                    parts.push({
                        tree, scatter, quat, baseScale,
                        cs: baseScale, cx: tree.x, cy: tree.y, cz: tree.z,
                        offset: Math.random() * 100, speed: 0.5 + Math.random()
                    });
                }

                geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));
                geo.setAttribute('aGlow', new THREE.InstancedBufferAttribute(glows, 1));

                const mesh = new THREE.InstancedMesh(geo, matLib.themeMap[d.type][0], n);
                mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                mesh.frustumCulled = false;

                for (let i = 0; i < n; i++) {
                    const p = parts[i];
                    _dummyP.set(p.cx, p.cy, p.cz);
                    _dummyQ.copy(p.quat);
                    _dummyS.setScalar(p.baseScale);
                    _dummyM.compose(_dummyP, _dummyQ, _dummyS);
                    mesh.setMatrixAt(i, _dummyM);
                }

                mainGroup.add(mesh);
                treeSystems.push({ type: d.type, mesh, parts });
            }
        }

        function updateTreeInstances(dt, time) {
            const mode = STATE.mode, isT1 = STATE.currentThemeIndex === 1;
            const floatAmp = isT1 ? 0.3 : 0.15;
            const lerpK = Math.min(1, 3 * dt), scaleK = Math.min(1, 5 * dt);

            for (const sys of treeSystems) {
                const parts = sys.parts, mesh = sys.mesh;
                for (let i = 0; i < parts.length; i++) {
                    const p = parts[i];
                    let tx, ty, tz, s = p.baseScale;

                    if (mode === 'FOCUS') {
                        tx = p.scatter.x; ty = p.scatter.y; tz = p.scatter.z; s = 0.001;
                    } else if (mode === 'SCATTER') {
                        const k = STATE.scatterScale;
                        tx = p.scatter.x * k; ty = p.scatter.y * k; tz = p.scatter.z * k;
                    } else if (mode === 'LETTER') {
                        tx = p.scatter.x; ty = p.scatter.y; tz = p.scatter.z;
                    } else {
                        tx = p.tree.x + Math.cos(time * 0.5 * p.speed + p.offset) * 0.1;
                        ty = p.tree.y + Math.sin(time * p.speed + p.offset) * floatAmp;
                        tz = p.tree.z;
                        if (isT1) s = p.baseScale * (1 + 0.2 * Math.sin(time * 3 + p.offset));
                    }

                    p.cx += (tx - p.cx) * lerpK;
                    p.cy += (ty - p.cy) * lerpK;
                    p.cz += (tz - p.cz) * lerpK;
                    p.cs += (s - p.cs) * scaleK;

                    _dummyP.set(p.cx, p.cy, p.cz);
                    _dummyQ.copy(p.quat);
                    _dummyS.setScalar(Math.max(p.cs, 0.0001));
                    _dummyM.compose(_dummyP, _dummyQ, _dummyS);
                    mesh.setMatrixAt(i, _dummyM);
                }
                mesh.instanceMatrix.needsUpdate = true;
            }
        }

        function createStarTopper() {
            const star = new THREE.Mesh(new THREE.OctahedronGeometry(1.5, 0), matLib.starGold);
            star.position.set(0, CONFIG.particles.treeHeight / 2 + 1.2, 0);

            // 原版 halo 是随星星自转的平面（会侧对镜头消失），改为始终朝向相机的 Sprite
            const halo = new THREE.Sprite(new THREE.SpriteMaterial({
                map: texLib.glow,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true,
                opacity: 0.55,
                color: 0xffaa00
            }));
            halo.scale.set(8, 8, 1);

            star.add(halo);
            starGroup.add(star);
            STATE.starMesh = star;
            STATE.starHaloMesh = halo;
        }

        /* ================================================================
         * 着色器粒子：共用的片元（柔光 / 闪烁 + 距离衰减 + 色彩管线对齐）
         * ================================================================ */
        const POINTS_FS = `
            uniform sampler2D uMap;
            uniform float uOpacity, uFlash;
            varying vec3 vColor;
            varying float vTw, vFade;
            void main() {
                float a = texture2D(uMap, gl_PointCoord).a;
                a *= uOpacity * mix(1.0, 0.15 + 1.85 * vTw * vTw, uFlash) * (0.65 + 0.35 * vTw) * vFade;
                if (a < 0.004) discard;
                gl_FragColor = vec4(vColor * (0.8 + 0.7 * vTw), a);
                #include <tonemapping_fragment>
                #include <colorspace_fragment>
            }
        `;

        // 形态渐变粒子：树形 ⇄ 星云散开（尘埃 + 星光）
        const MORPH_VS = `
            uniform float uTime, uScale, uTreeMix, uScatterScale, uFloatAmp;
            uniform vec3 uColor;
            attribute vec3 aTree, aScatter;
            attribute float aPhase, aSpeed, aSize, aStagger;
            varying vec3 vColor;
            varying float vTw, vFade;
            void main() {
                float m = smoothstep(0.0, 1.0, clamp((uTreeMix - aStagger * 0.35) / 0.65, 0.0, 1.0));
                vec3 tp = aTree;
                tp.y += sin(uTime * aSpeed + aPhase) * uFloatAmp;
                tp.x += cos(uTime * 0.5 * aSpeed + aPhase) * 0.12;
                vec3 sp = aScatter * uScatterScale;
                sp.y += sin(uTime * aSpeed * 0.6 + aPhase) * 0.5;
                vec3 p = mix(sp, tp, m);
                vec4 mv = modelViewMatrix * vec4(p, 1.0);
                vTw = 0.5 + 0.5 * sin(uTime * (0.8 + aSpeed * 0.7) + aPhase * 6.0);
                vColor = uColor;
                vFade = smoothstep(280.0, 120.0, -mv.z);
                gl_PointSize = min(aSize * (0.7 + 0.6 * vTw) * uScale / -mv.z, 48.0);
                gl_Position = projectionMatrix * mv;
            }
        `;

        // 飘落粒子：GPU 循环下落（雪 / 心）
        const FALL_VS = `
            uniform float uTime, uScale, uFall, uHalf;
            attribute float aSpeed, aPhase, aSize;
            attribute vec3 aColor;
            varying vec3 vColor;
            varying float vTw, vFade;
            void main() {
                vec3 p = position;
                float fall = uTime * uFall * aSpeed;
                p.y = mod(position.y - fall + uHalf, uHalf * 2.0) - uHalf;
                p.x += sin(uTime * 0.35 + aPhase) * 2.2;
                p.z += cos(uTime * 0.28 + aPhase * 1.7) * 1.6;
                vec4 mv = modelViewMatrix * vec4(p, 1.0);
                vTw = 0.5 + 0.5 * sin(uTime * (1.0 + fract(aPhase) * 1.5) + aPhase * 5.0);
                vColor = aColor;
                vFade = smoothstep(150.0, 85.0, -mv.z);
                gl_PointSize = min(aSize * uScale / -mv.z, 64.0);
                gl_Position = projectionMatrix * mv;
            }
        `;

        // 静态星野（银河背景）
        const STATIC_VS = `
            uniform float uTime, uScale;
            attribute float aSize, aPhase;
            attribute vec3 aColor;
            varying vec3 vColor;
            varying float vTw, vFade;
            void main() {
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                vTw = 0.55 + 0.45 * sin(uTime * (0.4 + fract(aPhase) * 1.3) + aPhase * 11.0);
                vColor = aColor;
                vFade = smoothstep(340.0, 140.0, -mv.z);
                gl_PointSize = min(aSize * uScale / -mv.z, 24.0);
                gl_Position = projectionMatrix * mv;
            }
        `;

        function makePointsMaterial(vs, map, colorHex, opacity, flash) {
            return new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uScale: { value: 400 },
                    uMap: { value: map },
                    uColor: { value: new THREE.Color(colorHex) },
                    uOpacity: { value: opacity },
                    uFlash: { value: flash ? 1 : 0 },
                    uTreeMix: { value: 1 },
                    uScatterScale: { value: 1 },
                    uFloatAmp: { value: 0.35 },
                    uFall: { value: 0 },
                    uHalf: { value: 50 }
                },
                vertexShader: vs,
                fragmentShader: POINTS_FS,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
        }

        function pointPixelScale() {
            return renderer.domElement.height * 0.5;
        }

        function createDustAndSparkles() {
            // 金色尘埃：绕树浮动
            {
                const count = CONFIG.particles.dustCount;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3), tree = new Float32Array(count * 3), scat = new Float32Array(count * 3);
                const phase = new Float32Array(count), speed = new Float32Array(count);
                const size = new Float32Array(count), stag = new Float32Array(count);
                const v = new THREE.Vector3();
                for (let i = 0; i < count; i++) {
                    treeFillPos(v);
                    tree.set([v.x, v.y, v.z], i * 3);
                    scatterPos(v, 15, 40);
                    scat.set([v.x, v.y, v.z], i * 3);
                    pos.set([tree[i*3], tree[i*3+1], tree[i*3+2]], i * 3);
                    phase[i] = Math.random() * Math.PI * 2;
                    speed[i] = 0.5 + Math.random();
                    size[i] = 0.32 + Math.random() * 0.6;
                    stag[i] = Math.random();
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('aTree', new THREE.BufferAttribute(tree, 3));
                geo.setAttribute('aScatter', new THREE.BufferAttribute(scat, 3));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
                geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
                geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
                geo.setAttribute('aStagger', new THREE.BufferAttribute(stag, 1));
                const mat = makePointsMaterial(MORPH_VS, texLib.glow, 0xffffee, 0.75, false);
                mat.uniforms.uFloatAmp.value = 0.35;
                const pts = new THREE.Points(geo, mat);
                pts.frustumCulled = false;
                mainGroup.add(pts);
                dustSys = { pts, mat };
            }

            // 四芒星光：树身高光闪烁
            {
                const count = CONFIG.particles.sparkleCount;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3), tree = new Float32Array(count * 3), scat = new Float32Array(count * 3);
                const phase = new Float32Array(count), speed = new Float32Array(count);
                const size = new Float32Array(count), stag = new Float32Array(count);
                const v = new THREE.Vector3();
                for (let i = 0; i < count; i++) {
                    if (Math.random() < 0.65) treeSurfacePos(v); else treeFillPos(v);
                    tree.set([v.x, v.y, v.z], i * 3);
                    scatterPos(v, 12, 26);
                    scat.set([v.x, v.y, v.z], i * 3);
                    pos.set([tree[i*3], tree[i*3+1], tree[i*3+2]], i * 3);
                    phase[i] = Math.random() * Math.PI * 2;
                    speed[i] = 0.6 + Math.random() * 0.9;
                    size[i] = 0.5 + Math.random() * 0.7;
                    stag[i] = Math.random();
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('aTree', new THREE.BufferAttribute(tree, 3));
                geo.setAttribute('aScatter', new THREE.BufferAttribute(scat, 3));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
                geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
                geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
                geo.setAttribute('aStagger', new THREE.BufferAttribute(stag, 1));
                const mat = makePointsMaterial(MORPH_VS, texLib.star, 0xffe6a3, 0.95, true);
                mat.uniforms.uFloatAmp.value = 0.22;
                const pts = new THREE.Points(geo, mat);
                pts.frustumCulled = false;
                mainGroup.add(pts);
                sparkleSys = { pts, mat };
            }
        }

        function createFallSystems() {
            // 雪（冰蓝主题）
            {
                const count = CONFIG.particles.snowCount;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3), color = new Float32Array(count * 3);
                const phase = new Float32Array(count), speed = new Float32Array(count), size = new Float32Array(count);
                for (let i = 0; i < count; i++) {
                    pos[i * 3] = (Math.random() - 0.5) * 100;
                    pos[i * 3 + 1] = (Math.random() - 0.5) * 100;
                    pos[i * 3 + 2] = (Math.random() - 0.5) * 60;
                    color.set([1, 1, 1], i * 3);
                    phase[i] = Math.random() * Math.PI * 2;
                    speed[i] = 1.0 + Math.random();
                    size[i] = 0.5 + Math.random() * 0.65;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
                geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
                geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
                const mat = makePointsMaterial(FALL_VS, texLib.glow, 0xffffff, 0.9, false);
                mat.uniforms.uFall.value = CONFIG.particles.snowSpeed;
                mat.uniforms.uHalf.value = 50;
                snowSystem = { pts: new THREE.Points(geo, mat), mat };
                snowSystem.pts.frustumCulled = false;
                snowSystem.pts.visible = false;
                bgGroup.add(snowSystem.pts);
            }

            // 心形雨（芭比主题）
            {
                const count = CONFIG.particles.heartCount;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3), color = new Float32Array(count * 3);
                const phase = new Float32Array(count), speed = new Float32Array(count), size = new Float32Array(count);
                const c1 = new THREE.Color(CONFIG.colors.barbieHot);
                const c2 = new THREE.Color(CONFIG.colors.barbieSoft);
                const c3 = new THREE.Color(0xffffff);
                for (let i = 0; i < count; i++) {
                    pos[i * 3] = (Math.random() - 0.5) * 120;
                    pos[i * 3 + 1] = (Math.random() - 0.5) * 120;
                    pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
                    const c = Math.random();
                    const fc = c < 0.4 ? c1 : (c < 0.7 ? c2 : c3);
                    color.set([fc.r, fc.g, fc.b], i * 3);
                    phase[i] = Math.random() * Math.PI * 2;
                    speed[i] = 0.5 + Math.random() * 0.8;
                    size[i] = 1.1 + Math.random() * 1.0;
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
                geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
                geo.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
                geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
                const mat = makePointsMaterial(FALL_VS, texLib.heart, 0xffffff, 0.65, false);
                mat.uniforms.uFall.value = CONFIG.particles.snowSpeed;
                mat.uniforms.uHalf.value = 60;
                heartSystem = { pts: new THREE.Points(geo, mat), mat };
                heartSystem.pts.frustumCulled = false;
                heartSystem.pts.visible = false;
                bgGroup.add(heartSystem.pts);
            }
        }

        function createGalaxyBackground() {
            const count = CONFIG.particles.galaxyCount;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3), color = new Float32Array(count * 3);
            const phase = new Float32Array(count), size = new Float32Array(count);
            const c1 = new THREE.Color(0x88aaff), c2 = new THREE.Color(0xffffee), c3 = new THREE.Color(0xffd700);

            for (let i = 0; i < count; i++) {
                const r = 60 + Math.random() * 250;
                const th = Math.random() * Math.PI * 2;
                const ph = Math.acos(2 * Math.random() - 1);
                pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
                pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
                pos[i * 3 + 2] = r * Math.cos(ph);
                const c = Math.random();
                const fc = c < 0.6 ? c2 : (c < 0.9 ? c1 : c3);
                color.set([fc.r, fc.g, fc.b], i * 3);
                phase[i] = Math.random() * Math.PI * 2;
                size[i] = 0.5 + Math.random() * 2.0;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('aColor', new THREE.BufferAttribute(color, 3));
            geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
            geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));

            const mat = makePointsMaterial(STATIC_VS, texLib.glow, 0xffffff, 0.85, false);
            galaxySystem = { pts: new THREE.Points(geo, mat), mat };
            galaxySystem.pts.frustumCulled = false;
            bgGroup.add(galaxySystem.pts);
        }

        /* ================================================================
         * 主题切换
         * ================================================================ */
        function switchTheme(themeIndex) {
            STATE.currentThemeIndex = themeIndex;

            const titleEl = document.getElementById('main-title');
            if (titleEl) {
                if (themeIndex === 0) {
                    titleEl.style.textShadow = '0 0 15px rgba(212, 175, 55, 0.4), 0 0 30px rgba(212, 175, 55, 0.2)';
                } else if (themeIndex === 1) {
                    titleEl.style.textShadow = '0 0 15px rgba(0, 255, 255, 0.6), 0 0 30px rgba(0, 255, 255, 0.4), 0 0 45px rgba(170, 221, 255, 0.3)';
                } else if (themeIndex === 2) {
                    titleEl.style.textShadow = '0 0 15px rgba(255, 22, 148, 0.6), 0 0 30px rgba(255, 183, 197, 0.4)';
                }
            }

            renderer.toneMappingExposure = (themeIndex === 1) ? 1.2 : (themeIndex === 2 ? 0.9 : 1.0);

            if (galaxySystem) galaxySystem.pts.visible = (themeIndex === 0);
            if (snowSystem) snowSystem.pts.visible = (themeIndex === 1);
            if (heartSystem) heartSystem.pts.visible = (themeIndex === 2);

            // 着色器粒子主题色
            if (dustSys) {
                dustSys.mat.uniforms.uColor.value.setHex(
                    themeIndex === 2 ? 0xffc4e0 : (themeIndex === 1 ? 0x9fe8ff : 0xffffee)
                );
            }
            if (sparkleSys) {
                sparkleSys.mat.uniforms.uColor.value.setHex(
                    themeIndex === 2 ? 0xffb8de : (themeIndex === 1 ? 0xd8f6ff : 0xffe6a3)
                );
            }

            const fogColor = (themeIndex === 2) ? 0x1a0510 : ((themeIndex === 1) ? 0x000510 : CONFIG.colors.bg);
            scene.fog.color.setHex(fogColor);
            scene.background.setHex(fogColor);

            // 树身粒子整体换材质（InstancedMesh 一次赋值即可）
            for (const sys of treeSystems) {
                sys.mesh.material = matLib.themeMap[sys.type][themeIndex];
            }

            if (STATE.starMesh && STATE.starHaloMesh) {
                if (themeIndex === 0) {
                    STATE.starMesh.material = matLib.starGold;
                    STATE.starHaloMesh.material.color.setHex(0xffaa00);
                } else if (themeIndex === 1) {
                    STATE.starMesh.material = matLib.starIce;
                    STATE.starHaloMesh.material.color.setHex(CONFIG.colors.iceCyan);
                } else {
                    STATE.starMesh.material = matLib.starBarbie;
                    STATE.starHaloMesh.material.color.setHex(CONFIG.colors.barbieHot);
                }
            }
        }

        /* ================================================================
         * 照片系统（保留原版交互）
         * ================================================================ */
        class PhotoParticle {
            constructor(group) {
                this.mesh = group; this.type = 'PHOTO';
                const t = Math.pow(Math.random(), 0.8);
                const h = CONFIG.particles.treeHeight;
                const y = t * h - h / 2;
                const a = Math.random() * Math.PI * 2;
                const r = Math.max(1.6, CONFIG.particles.treeRadius * (1.0 - t));
                this.posTree = new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
                this.posScatter = scatterPos(new THREE.Vector3(), 11, 25);
                this.baseScale = 1; this.curScale = 1;
                this.offset = Math.random() * 100;
                this.speed = 0.5 + Math.random();
            }

            update(dt, time, mode, focusTarget, invMatrix) {
                let target, s = this.baseScale, lerpSpeed = 3.0;

                if (mode === 'FOCUS') {
                    if (this.mesh === focusTarget && invMatrix) {
                        _targetVec.set(0, 0, camera.position.z - 15).applyMatrix4(invMatrix);
                        target = _targetVec;
                        lerpSpeed = 6.0;
                        this.mesh.lookAt(camera.position);
                        s = this.baseScale * 5.0;
                    } else {
                        target = this.posScatter;
                        s = 0.01;
                    }
                } else if (mode === 'SCATTER') {
                    _targetVec.copy(this.posScatter).multiplyScalar(STATE.scatterScale);
                    target = _targetVec;
                    s = this.baseScale * 2.5;
                } else if (mode === 'LETTER') {
                    target = this.posScatter;
                    s = this.baseScale * 2.5;
                } else {
                    const floatScale = (STATE.currentThemeIndex === 1) ? 0.3 : 0.15;
                    _targetVec.copy(this.posTree);
                    _targetVec.y += Math.sin(time * this.speed + this.offset) * floatScale;
                    target = _targetVec;
                }

                this.mesh.position.lerp(target, lerpSpeed * dt);
                this.curScale += (s - this.curScale) * Math.min(1, 5 * dt);
                this.mesh.scale.setScalar(Math.max(this.curScale, 0.001));
            }
        }

        function addPhotoToScene(texture) {
            if (!texture.image) return;
            const aspect = texture.image.width / texture.image.height;
            let photoW = (aspect >= 1) ? 1.2 : 1.2 * aspect,
                photoH = (aspect >= 1) ? 1.2 / aspect : 1.2;

            const group = new THREE.Group();
            const frameGeo = new THREE.BoxGeometry(photoW + 0.15, photoH + 0.15, 0.1);

            let currentFrameMat;
            if (STATE.currentThemeIndex === 0) currentFrameMat = matLib.frameGold;
            else if (STATE.currentThemeIndex === 1) currentFrameMat = matLib.frameIce;
            else currentFrameMat = matLib.frameBarbie;

            const frame = new THREE.Mesh(frameGeo, currentFrameMat);
            group.add(frame);

            const photo = new THREE.Mesh(new THREE.PlaneGeometry(photoW, photoH), new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.DoubleSide
            }));
            photo.position.z = 0.06;
            group.add(photo);

            const borderGeo = new THREE.BoxGeometry(photoW + 0.25, photoH + 0.25, 0.08);
            const border = new THREE.Mesh(borderGeo, matLib.snowBorder);
            border.position.z = -0.02;
            border.visible = (STATE.currentThemeIndex !== 0);
            group.add(border);

            photoMeshGroup.add(group);
            photoParticles.push(new PhotoParticle(group));
        }

        function handleImageUpload(e) {
            if (!e.target.files.length) return;
            Array.from(e.target.files).forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    new THREE.TextureLoader().load(ev.target.result, t => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t);
                    });
                };
                reader.onerror = (error) => console.error('图片加载失败:', error);
                reader.readAsDataURL(f);
            });
        }

        function clearPhotos() {
            photoParticles.forEach(p => {
                photoMeshGroup.remove(p.mesh);
                p.mesh.traverse(child => {
                    if (child.isMesh) {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) {
                            if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                            else child.material.dispose();
                        }
                    }
                });
            });
            photoParticles = [];
            STATE.currentPhotoIndex = -1;
        }

        /* ================================================================
         * 导出 / 导入
         * ================================================================ */
        function exportSceneData() {
            const photos = photoParticles.map(p => {
                try {
                    const photoMesh = p.mesh.children[1];
                    if (photoMesh && photoMesh.material.map && photoMesh.material.map.image) {
                        const canvas = document.createElement('canvas');
                        canvas.width = photoMesh.material.map.image.width;
                        canvas.height = photoMesh.material.map.image.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(photoMesh.material.map.image, 0, 0);
                        return canvas.toDataURL('image/jpeg', 0.8);
                    }
                } catch (e) {
                    console.error('导出照片时出错:', e);
                }
                return null;
            }).filter(src => src !== null);

            const exportData = {
                version: 2,
                music: STATE.musicData,
                letter: STATE.letterContent,
                photos: photos,
                theme: STATE.currentThemeIndex,
                title: document.getElementById('main-title').innerText,
                isGestureSwitchEnabled: STATE.isGestureSwitchEnabled
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "tree_scene.json";
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 100);
            showToast('已导出场景文件');
        }

        function importSceneData(jsonData) {
            try {
                const data = JSON.parse(jsonData);

                if (data.title) {
                    document.getElementById('main-title').innerText = data.title;
                }

                if (data.isGestureSwitchEnabled !== undefined) {
                    STATE.isGestureSwitchEnabled = data.isGestureSwitchEnabled;
                }

                if (data.letter !== undefined) {
                    STATE.letterContent = data.letter;
                }

                if (data.music) {
                    STATE.musicData = data.music;
                    const audioEl = document.getElementById('bg-music');
                    audioEl.src = data.music;
                    audioEl.currentTime = 0;
                    audioEl.play().catch(err => console.warn('音乐播放失败:', err));
                }

                clearPhotos();
                if (data.photos && Array.isArray(data.photos)) {
                    const loader = new THREE.TextureLoader();
                    data.photos.forEach((src, index) => {
                        setTimeout(() => {
                            loader.load(src, t => {
                                t.colorSpace = THREE.SRGBColorSpace;
                                addPhotoToScene(t);
                            }, undefined, (error) => console.error(`照片${index}加载失败:`, error));
                        }, index * 100);
                    });
                }

                if (data.theme !== undefined) {
                    switchTheme(data.theme);
                }

                showToast('导入成功');
                setTimeout(() => {
                    try {
                        document.documentElement.requestFullscreen().catch(err => {
                            console.log("自动全屏被浏览器策略阻止:", err);
                        });
                    } catch (err) {
                        console.log("全屏请求失败:", err);
                    }
                }, 500);
            } catch (e) {
                console.error("导入失败:", e);
                alert("文件格式错误，无法导入");
            }
        }

        /* ================================================================

            };

            document.getElementById('btn-save-letter').onclick = (e) => {
                e.stopPropagation();

                modal.style.display = 'none';
                showToast(STATE.letterContent ? '书信已保存' : '书信内容已清空');
            };

            document.getElementById('btn-close-letter-mode').onclick = (e) => {
