        function enterLetterMode() {
            if (STATE.mode === 'LETTER') return;

            if (!STATE.letterContent || STATE.letterContent.trim() === "") {
                showToast('请先在菜单中撰写书信内容');
                return;
            }

            STATE.mode = 'LETTER';
            document.body.classList.remove('menu-open');
            const overlay = document.getElementById('letter-overlay'),
                paper = document.querySelector('.letter-paper'),
                display = document.getElementById('letter-content-display');

            overlay.style.display = 'flex';
            requestAnimationFrame(() => {
                overlay.style.opacity = 1;
                paper.style.transform = 'translateY(0)';
            });

            display.textContent = '';
            display.classList.remove('cursor');

            let i = 0;
            const typeWriter = () => {
                if (STATE.mode !== 'LETTER') return;
                if (i < STATE.letterContent.length) {
                    display.textContent += STATE.letterContent.charAt(i++);
                    display.scrollTop = display.scrollHeight;
                    STATE.letterTyper = setTimeout(typeWriter, 100);
                } else {
                    display.classList.remove('cursor');
                }
            };

            STATE.letterStartTimer = setTimeout(() => {
                if (STATE.mode === 'LETTER') {
                    display.classList.add('cursor');
                    typeWriter();
                }
            }, 2000);
        }

        function exitLetterMode() {
            STATE.mode = 'TREE';
            clearTimeout(STATE.letterTyper);
            clearTimeout(STATE.letterStartTimer);

            const overlay = document.getElementById('letter-overlay'),
                paper = document.querySelector('.letter-paper');

            overlay.style.opacity = 0;
            paper.style.transform = 'translateY(20px)';

            setTimeout(() => { overlay.style.display = 'none'; }, 500);

            STATE.spinVel.x = 0;
            STATE.spinVel.y = 0;
        }

        /* ================================================================
         * 手势识别（MediaPipe）：由"开启手势互动"按钮触发（需要用户操作才弹权限窗）
         * 顺序：先申请摄像头（权限窗紧跟用户点击，弹得出来）→ 再下载模型（首次较慢）
         * ================================================================ */
        let gestureInitPromise = null;
        let gestureStream = null;

        function onGestureReady() {
            const cta = document.getElementById('gesture-cta');
            if (cta) {
                cta.dataset.state = 'on';
                cta.classList.add('hidden');
                setTimeout(() => cta.remove(), 600);
            }
            showToast('手势已开启：手掌缩放 · 食指看照片 · 竖拇指换色');
        }

        function startGesture(onStep) {
            // 防止重复初始化（模型加载期间用户再点重试，不会创建多个摄像头流）
            if (!gestureInitPromise) {
                gestureInitPromise = initMediaPipe(onStep).then(ok => {
                    if (ok === true) onGestureReady();
                    else gestureInitPromise = null; // 失败允许重试
                    return ok;
                }).catch(err => {
                    gestureInitPromise = null;
                    throw err;
                });
            }
            return gestureInitPromise;
        }

        async function initMediaPipe(onStep) {
            try {
                // 1) 先申请摄像头：必须紧跟用户点击的调用栈，权限弹窗才可靠出现
                if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
                    console.warn('摄像头不可用');
                    return false;
                }
                if (!gestureStream || !gestureStream.active) {
                    gestureStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: "user",
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    });
                }
                onStep && onStep('正在加载手势模型...');
                setGestureStatus('摄像头已就绪，加载手势模型...', true);

                // 2) 加载 MediaPipe 模型（模型文件托管在本站 /models/ 下，不依赖被墙的谷歌源）
                const mp = await import('@mediapipe/tasks-vision');
                const { FilesetResolver, HandLandmarker, DrawingUtils } = mp;

                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                // GPU 加速在部分设备上不可用，失败自动回落 CPU 兼容模式
                const makeLandmarker = (delegate) => HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: './models/hand_landmarker.task',
                        delegate
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                try {
                    handLandmarker = await makeLandmarker("GPU");
                } catch (gpuErr) {
                    console.warn('GPU delegate 不可用，改用 CPU:', gpuErr);
                    setGestureStatus('GPU 不可用，切换 CPU 模式...', true);
                    handLandmarker = await makeLandmarker("CPU");
                }
                setGestureStatus('模型就绪，启动识别...', true);

                video = document.getElementById('webcam');
                canvasCtx = document.getElementById('webcam-preview').getContext('2d');
                drawingUtils = new DrawingUtils(canvasCtx);

                video.srcObject = gestureStream;
                await new Promise((resolve) => {
                    video.addEventListener("loadeddata", resolve, { once: true });
                });

                video.play();
                const wrapper = document.getElementById('webcam-wrapper');
                wrapper.style.opacity = 1;
                const aspect = video.videoWidth / video.videoHeight || (4 / 3);
                wrapper.style.width = IS_MOBILE ? '96px' : '120px';
                wrapper.style.height = ((IS_MOBILE ? 96 : 120) / aspect) + 'px';
                document.getElementById('webcam-preview').width = video.videoWidth;
                document.getElementById('webcam-preview').height = video.videoHeight;

                predictWebcam();
                return true;
            } catch (error) {
                console.error('MediaPipe初始化失败:', error);
                setGestureStatus('手势初始化失败：' + (error && error.message ? error.message.slice(0, 60) : '未知错误'), true);
                return false;
            }
        }

        let lastVideoTime = -1;
        let detectErrorCount = 0;
        let switchedToCPU = false;
        let statusFrame = 0;
        async function predictWebcam() {
            if (!handLandmarker || !video) return;

            if (video.readyState < 2) {
                statusFrame++;
                if (statusFrame % 30 === 0) setGestureStatus('等待摄像头画面...', true);
                requestAnimationFrame(predictWebcam);
                return;
            }

            if (lastVideoTime !== video.currentTime && video.readyState >= 2) {
                lastVideoTime = video.currentTime;
                try {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    detectErrorCount = 0;
                    canvasCtx.clearRect(0, 0, canvasCtx.canvas.width, canvasCtx.canvas.height);
                    canvasCtx.drawImage(video, 0, 0, canvasCtx.canvas.width, canvasCtx.canvas.height);

                    statusFrame++;
                    if (statusFrame % 15 === 0) {
                        setGestureStatus(result.landmarks?.[0] ? '已检测到手 ✓' : '未检测到手 · 请把手伸到镜头前', true);
                    }

                    if (result.landmarks?.[0]) {
                        if (!STATE.firstHandSeen) {
                            STATE.firstHandSeen = true;
                            showToast('已检测到手 ✓ 按提示做手势即可');
                        }
                        drawingUtils.drawConnectors(result.landmarks[0], HandLandmarker.HAND_CONNECTIONS, { color: "#d4af37", lineWidth: 3 });
                        drawingUtils.drawLandmarks(result.landmarks[0], { color: "#ffffff", lineWidth: 1, radius: 3 });
                        processGestures(result.landmarks[0]);
                    } else {
                        STATE.hand.detected = false;
                    }
                } catch (error) {
                    detectErrorCount++;
                    console.error('手势识别失败:', error);
                    setGestureStatus('识别出错 x' + detectErrorCount + (switchedToCPU ? ' · 已切兼容模式' : ''), true);
                    // GPU 推理连续报错时自动切换 CPU 兼容模式
                    if (detectErrorCount >= 5 && !switchedToCPU) {
                        switchedToCPU = true;
                        showToast('手势识别异常，正在切换兼容模式...');
                        try {
                            await handLandmarker.setOptions({ baseOptions: { delegate: "CPU" } });
                            detectErrorCount = 0;
                        } catch (e2) {
                            console.error('切换 CPU 失败:', e2);
                        }
                    }
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(lm) {
            STATE.hand.detected = true;
            if (STATE.mode === 'LETTER') return;

            const dist = (i, j) => Math.hypot(lm[i].x - lm[j].x, lm[i].y - lm[j].y);
            const dIndex = dist(8, 0),
                dMiddle = dist(12, 0),
                dRing = dist(16, 0),
                dPinky = dist(20, 0);
            const palmSize = dist(0, 9);

            // OK手势触发书信逻辑
            if (dist(4, 8) < 0.05 && dMiddle > 0.15 && dMiddle > dIndex * 1.2) {
                if (STATE.letterContent && STATE.letterContent.trim() !== "") {
                    if (Date.now() - STATE.letterLastTriggerTime > 1000) {
                        STATE.letterLastTriggerTime = Date.now();
                        enterLetterMode();
                    }
                }
                return;
            }

            const areFourFingersOpen = (dIndex > palmSize * 1.3) &&
                (dMiddle > palmSize * 1.3) &&
                (dRing > palmSize * 1.3) &&
                (dPinky > palmSize * 1.3);
            const isThumbTucked = dist(4, 9) < palmSize * 0.6;
            const isOldSwitchGesture = areFourFingersOpen && isThumbTucked;

            const isThumbExtended = dist(4, 9) > palmSize * 0.85;
            const isIndexCurled = dist(8, 9) < palmSize * 0.65;
            const isMiddleCurled = dist(12, 9) < palmSize * 0.65;
            const isRingCurled = dist(16, 9) < palmSize * 0.65;
            const isPinkyCurled = dist(20, 9) < palmSize * 0.65;

            const isThumbsUpGesture = isThumbExtended && isIndexCurled && isMiddleCurled && isRingCurled && isPinkyCurled;

            if ((isOldSwitchGesture || isThumbsUpGesture) && STATE.isGestureSwitchEnabled) {
                if (Date.now() - STATE.gestureDebounceTimer > 2000) {
                    switchTheme((STATE.currentThemeIndex + 1) % 3);
                    STATE.gestureDebounceTimer = Date.now();
                }
            }

            const isPointing = dIndex > 0.1 && dMiddle < dIndex * 0.7 && dRing < dIndex * 0.7;
            const avgSpread = (dIndex + dMiddle + dRing + dPinky) / 4,
                isPalmOpen = avgSpread > CONFIG.gestures.palmOpenThreshold;

            if (isPointing) {
                STATE.mode = 'FOCUS';
                if (!STATE.wasPointing) {
                    if (photoParticles.length > 0) {
                        STATE.currentPhotoIndex = (STATE.currentPhotoIndex + 1) % photoParticles.length;
                        STATE.focusTarget = photoParticles[STATE.currentPhotoIndex].mesh;
                    } else {
                        STATE.focusTarget = STATE.starMesh;
                    }
                }
                STATE.wasPointing = true;
                STATE.hasPalmCenter = false;
                STATE.spinVel.x *= 0.9;
                STATE.spinVel.y *= 0.9;
            } else {
                STATE.wasPointing = false;
                if (isPalmOpen) {
                    if (STATE.mode !== 'SCATTER' || !STATE.hasPalmCenter) {
                        STATE.palmCenter = { x: lm[9].x, y: lm[9].y };
                        STATE.hasPalmCenter = true;
                        STATE.gestureBaseSpread = avgSpread;
                        STATE.scatterScale = 1.0;
                    }
                    STATE.mode = 'SCATTER';
                    if (STATE.gestureBaseSpread) {
                        STATE.scatterScale += (THREE.MathUtils.clamp(Math.pow(STATE.gestureBaseSpread / avgSpread, 2), 0.1, 5.0) - STATE.scatterScale) * 0.15;
                    }
                    const gain = CONFIG.gestures.sensitivity,
                        dx = lm[9].x - STATE.palmCenter.x,
                        dy = lm[9].y - STATE.palmCenter.y;
                    STATE.spinVel.x += (THREE.MathUtils.clamp(-dy * gain, -3, 3) - STATE.spinVel.x) * 0.2;
                    STATE.spinVel.y += (THREE.MathUtils.clamp(dx * gain, -3, 3) - STATE.spinVel.y) * 0.2;
                } else {
                    STATE.mode = 'TREE';
                    STATE.hasPalmCenter = false;
                    STATE.scatterScale = 1.0;
                    STATE.spinVel.x *= 0.9;
                    STATE.spinVel.y *= 0.9;
                }
            }

            if (STATE.mode !== 'FOCUS') {
                STATE.hand.x += ((lm[9].x - 0.5) * 3.0 - STATE.hand.x) * 0.1;
                STATE.hand.y += ((lm[9].y - 0.5) * 3.0 - STATE.hand.y) * 0.1;
            }
        }

        /* ================================================================
         * 触控 / 鼠标：拖动旋转、双指缩放、双击换主题、滚轮缩放
         * ================================================================ */
        const pointers = new Map();
        let pinchBaseDist = 0, pinchBaseZoom = 1;
        let singleDragId = null;
        let tapDownT = 0, tapMoved = 0;
        let lastTapT = 0, lastTapX = 0, lastTapY = 0;

        function setupPointerControls() {
            const cvs = renderer.domElement;

            cvs.addEventListener('contextmenu', e => e.preventDefault());

            cvs.addEventListener('pointerdown', e => {
                document.body.classList.remove('menu-open');
                if (STATE.mode === 'LETTER') return;
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 2) {
                    const [a, b] = [...pointers.values()];
                    pinchBaseDist = Math.hypot(a.x - b.x, a.y - b.y);
                    pinchBaseZoom = STATE.zoomTarget;
                    singleDragId = null;
                } else if (pointers.size === 1) {
                    singleDragId = e.pointerId;
                    tapDownT = performance.now();
                    tapMoved = 0;
                    STATE.dragSpin = 0;
                    STATE._lastDragT = performance.now();
                }
                try { cvs.setPointerCapture(e.pointerId); } catch (_) { }
            });

            cvs.addEventListener('pointermove', e => {
                const rec = pointers.get(e.pointerId);
                if (!rec) return;
                const dx = e.clientX - rec.x, dy = e.clientY - rec.y;
                rec.x = e.clientX; rec.y = e.clientY;
                tapMoved += Math.abs(dx) + Math.abs(dy);

                if (pointers.size === 1 && e.pointerId === singleDragId) {
                    STATE.rotation.y += dx * 0.005;
                    STATE.rotation.x = THREE.MathUtils.clamp(STATE.rotation.x + dy * 0.0035, -0.7, 0.9);
                    STATE.userTiltUntil = performance.now() + 1600;
                    const now = performance.now();
                    const dtm = Math.max(8, now - STATE._lastDragT);
                    STATE._lastDragT = now;
                    const inst = THREE.MathUtils.clamp(dx * 0.005 / (dtm / 1000), -5, 5);
                    STATE.dragSpin += (inst - STATE.dragSpin) * 0.4;
                } else if (pointers.size === 2 && pinchBaseDist > 0) {
                    const [a, b] = [...pointers.values()];
                    const d = Math.hypot(a.x - b.x, a.y - b.y);
                    STATE.zoomTarget = THREE.MathUtils.clamp(pinchBaseZoom * (d / pinchBaseDist), CONFIG.camera.minZoom, CONFIG.camera.maxZoom);
                }
            });

            const onPointerEnd = (e) => {
                if (!pointers.has(e.pointerId)) return;
                pointers.delete(e.pointerId);
                if (pointers.size === 1) {
                    pinchBaseDist = 0;
                    singleDragId = [...pointers.keys()][0];
                    return;
                }
                if (pointers.size > 1) return;
                singleDragId = null;

                // 双击换主题
                const dur = performance.now() - tapDownT;
                if (dur < 350 && tapMoved < 14) {
                    const now = performance.now();
                    if (now - lastTapT < 380 && Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 40) {
                        switchTheme((STATE.currentThemeIndex + 1) % 3);
                        lastTapT = 0;
                    } else {
                        lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
                    }
                }
            };
            cvs.addEventListener('pointerup', onPointerEnd);
            cvs.addEventListener('pointercancel', onPointerEnd);

            // 桌面滚轮缩放
            cvs.addEventListener('wheel', (e) => {
                e.preventDefault();
                STATE.zoomTarget = THREE.MathUtils.clamp(
                    STATE.zoomTarget * (1 + e.deltaY * 0.0009),
                    CONFIG.camera.minZoom, CONFIG.camera.maxZoom
                );
            }, { passive: false });
        }

        /* ================================================================
         * UI 事件
         * ================================================================ */
        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = 1;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.style.opacity = 0; }, 2200);
        }

        function setGestureStatus(text, show) {
            const s = document.getElementById('gesture-status');
            if (!s) return;
            s.textContent = text;
            s.style.display = show === false ? 'none' : 'block';
        }

        function setupEvents() {
            const fsBtn = document.getElementById('btn-fullscreen');

            // 窗口变化：自适应取景 + 渲染尺寸
            window.addEventListener('resize', onResize);
            window.visualViewport?.addEventListener('resize', onResize);

            // 照片上传
            const fileInput = document.getElementById('file-input');
            document.getElementById('btn-add-photo').onclick = (e) => {
                e.stopPropagation();
                fileInput.click();
            };
            fileInput.onchange = handleImageUpload;

            // 音乐上传
            const musicInput = document.getElementById('music-input'),
                audioEl = document.getElementById('bg-music');
            document.getElementById('btn-bg-music').onclick = (e) => {
                e.stopPropagation();
                musicInput.click();
            };

            musicInput.onchange = (e) => {
                if (e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function (evt) {
                        STATE.musicData = evt.target.result;
                        audioEl.src = evt.target.result;
                        audioEl.currentTime = 0;
                        audioEl.play().then(() => showToast('音乐已播放')).catch(err => {
                            console.warn('音乐播放失败:', err);
                            showToast('音乐播放被浏览器拦截，请再点一次');
                        });
                    };
                    reader.onerror = (error) => console.error('音乐文件读取失败:', error);
                    reader.readAsDataURL(e.target.files[0]);
                }
            };

            // 设置标题
            document.getElementById('btn-set-title').onclick = (e) => {
                e.stopPropagation();
                const currentTitle = document.getElementById('main-title').innerText;
                const newTitle = prompt("请输入页面标题:", currentTitle);
                if (newTitle !== null && newTitle.trim() !== '') {
                    document.getElementById('main-title').innerText = newTitle.trim();
                }
            };

            // 全屏控制
            if (!document.documentElement.requestFullscreen) {
                // iOS iPhone Safari 不支持网页全屏
                fsBtn.style.display = 'none';
            }
            fsBtn.onclick = (e) => {
                e.stopPropagation();
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                } else {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log("全屏请求失败:", err);
                    });
                }
            };

            document.addEventListener('fullscreenchange', () => {
                const isFs = !!document.fullscreenElement;
                fsBtn.textContent = isFs ? '取消全屏' : '全屏显示';

                const colMedia = document.getElementById('col-media');
                const btnImport = document.getElementById('btn-import');
                const btnExport = document.getElementById('btn-export');

                colMedia.style.display = isFs ? 'none' : 'flex';
                btnImport.style.display = isFs ? 'none' : 'block';
                btnExport.style.display = isFs ? 'none' : 'block';
            });

            // 导出场景
            document.getElementById('btn-export').onclick = (e) => {
                e.stopPropagation();
                exportSceneData();
            };

            // 导入场景
            const importInput = document.getElementById('import-input');
            document.getElementById('btn-import').onclick = (e) => {
                e.stopPropagation();
                importInput.click();
            };
            importInput.onchange = (e) => {
                if (e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (evt) => importSceneData(evt.target.result);
                    reader.onerror = (error) => {
                        console.error('文件读取失败:', error);
                        alert('文件读取失败，请重试');
                    };
                    reader.readAsText(e.target.files[0]);
                }
            };

            // 颜色切换：单击循环主题；长按切换"手势换色"开关
            const btnSwitch = document.getElementById('btn-switch-theme');
            let lpTimer = null;
            const toggleGestureSwitch = () => {
                STATE.isGestureSwitchEnabled = !STATE.isGestureSwitchEnabled;
                btnSwitch.classList.toggle('disabled', !STATE.isGestureSwitchEnabled);
                showToast(STATE.isGestureSwitchEnabled ? '手势换色已开启' : '手势换色已关闭（仍可点按钮切换）');
            };
            btnSwitch.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                lpTimer = setTimeout(() => { lpTimer = null; toggleGestureSwitch(); }, 650);
            });
            btnSwitch.addEventListener('pointerup', (e) => {
                e.stopPropagation();
                if (lpTimer) {
                    clearTimeout(lpTimer); lpTimer = null;
                    switchTheme((STATE.currentThemeIndex + 1) % 3);
                }
            });
            btnSwitch.addEventListener('pointerleave', () => {
                if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
            });

            // 手势互动入口：点击时主动申请摄像头权限（浏览器要求用户操作后才弹权限窗）
            const gestureCta = document.getElementById('gesture-cta');
            gestureCta.addEventListener('click', async (e) => {
                e.stopPropagation();
                if (gestureCta.dataset.state === 'loading' || gestureCta.dataset.state === 'on') return;
                gestureCta.dataset.state = 'loading';
                gestureCta.textContent = '正在申请摄像头权限...';
                // 60 秒兜底（模型首次下载可能较慢）；期间可点重试继续等待
                let timedOut = false;
                const ok = await Promise.race([
                    startGesture(step => { if (!timedOut && step) gestureCta.textContent = step; }),
                    new Promise(res => setTimeout(() => { timedOut = true; res('timeout'); }, 60000))
                ]);
                if (ok === true) return; // 成功：onGestureReady 已隐藏按钮
                if (ok === 'timeout') {
                    // 不误报失败：后台仍在加载，加载成功会自动隐藏按钮
                    gestureCta.textContent = '加载较慢，仍在后台加载...';
                    showToast('模型加载较慢，请保持页面打开稍候');
                    const finalOk = await Promise.race([
                        startGesture(),
                        new Promise(res => setTimeout(() => res('timeout2'), 180000))
                    ]);
                    if (finalOk === true) return;
                    gestureCta.dataset.state = 'off';
                    gestureCta.innerHTML = '<span class="cta-icon">✋</span>手势不可用 点击重试';
                    showToast('加载超时，请检查网络后点击重试');
                    return;
                }
                gestureCta.dataset.state = 'off';
                gestureCta.innerHTML = '<span class="cta-icon">✋</span>手势不可用 点击重试';
                showToast('无法访问摄像头，请允许摄像头权限后重试');
            });

            // 移动端菜单开合
            document.getElementById('menu-toggle').addEventListener('click', (e) => {
                e.stopPropagation();
                document.body.classList.toggle('menu-open');
            });
            document.getElementById('top-right-controls').addEventListener('click', (e) => {
                if (e.target.classList.contains('control-btn') && IS_MOBILE) {
                    setTimeout(() => document.body.classList.remove('menu-open'), 150);
                }
            });

            // 触控 / 鼠标交互
            setupPointerControls();

            // 页面卸载时清理资源
            window.addEventListener('beforeunload', () => {
                if (STATE.musicData) {
                    const a = document.getElementById('bg-music');
                    a.pause();
                    a.src = '';
                }
                if (video && video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }
                if (handLandmarker) {
                    try { handLandmarker.close(); } catch (_) { }
                }
            });

            // 点击空白处关闭模态框
            document.addEventListener('click', (e) => {
                const modal = document.getElementById('letter-editor-modal');
                if (modal.style.display === 'flex' && !modal.contains(e.target)) {
                    modal.style.display = 'none';
                }
            });
        }

        /* ================================================================
         * 自适应取景：任何屏幕比例（含手机竖屏）树都完整可见
         * ================================================================ */
        function fitCamera() {
            const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
            const halfH = CONFIG.particles.treeHeight / 2 + 4.0;
            const halfW = CONFIG.particles.treeRadius + 3.5;
            const zH = halfH / Math.tan(halfFov);
            const zW = halfW / (Math.tan(halfFov) * camera.aspect);
            CONFIG.camera.baseZ = Math.max(zH, zW) * 1.22;
        }

        function onResize() {
            if (!renderer || !composer) return;
            const w = window.innerWidth, h = window.innerHeight;
            _lastW = w; _lastH = h;
            camera.aspect = w / h;
            fitCamera();
            camera.position.z = CONFIG.camera.baseZ * STATE.zoom;
            camera.updateProjectionMatrix();

            renderer.setPixelRatio(DPR_CAP);
            renderer.setSize(w, h);
            composer.setPixelRatio(DPR_CAP);
            composer.setSize(w, h);

            const s = pointPixelScale();
            [dustSys, sparkleSys, snowSystem, heartSystem, galaxySystem].forEach(sys => {
                if (sys) sys.mat.uniforms.uScale.value = s;
            });
        }

        /* ================================================================
         * 帧率自适应：低端设备自动再降一档像素比
         * ================================================================ */
        const AQ = { frames: 0, acc: 0, level: 0, done: false };
        function adaptCheck(dt) {
            if (AQ.done) return;
            AQ.acc += dt; AQ.frames++;
            if (AQ.acc >= 3) {
                const fps = AQ.frames / AQ.acc;
                AQ.acc = 0; AQ.frames = 0;
                if (fps < 34 && AQ.level < 2) {
                    AQ.level++;
                    DPR_CAP = Math.max(1, DPR_CAP - 0.25);
                    onResize();
                } else if (fps >= 50) {
                    AQ.done = true;
                }
            }
        }

        /* ================================================================
         * 主循环
         * ================================================================ */
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            STATE.time = clock.elapsedTime;
            const time = STATE.time;
            uTimeUniform.value = time;

            // 视口尺寸守护：某些内嵌环境初始化时视口未就绪且不触发 resize 事件
            if (window.innerWidth !== _lastW || window.innerHeight !== _lastH) {
                onResize();
            }

            // 着色器粒子时间
            [dustSys, sparkleSys, snowSystem, heartSystem, galaxySystem].forEach(sys => {
                if (sys) sys.mat.uniforms.uTime.value = time;
            });

            const inputX = STATE.hand.detected ? STATE.hand.x : 0;
            const dragging = singleDragId !== null && pointers.size === 1;

            if (STATE.mode === 'LETTER') {
                STATE.rotation.x = THREE.MathUtils.lerp(STATE.rotation.x, Math.PI / 4, dt * 1.5);
                STATE.rotation.y -= 0.1 * dt;
            } else if (STATE.mode === 'TREE') {
                const baseSpeed = (STATE.currentThemeIndex === 1) ? 0.6 : 0.4;
                STATE.rotation.y -= baseSpeed * dt;
                // 触控惯性
                if (!dragging) {
                    STATE.rotation.y += STATE.dragSpin * dt;
                    STATE.dragSpin *= Math.pow(0.22, dt);
                }
                // 竖向拖动后短暂保留用户视角，之后回落到默认仰角
                if (performance.now() >= STATE.userTiltUntil) {
                    STATE.rotation.x = THREE.MathUtils.lerp(STATE.rotation.x, 0.15, dt * 2.0);
                }
                mainGroup.rotation.z = THREE.MathUtils.lerp(mainGroup.rotation.z, inputX * 0.1, dt * 2);
            } else if (STATE.mode === 'SCATTER') {
                STATE.rotation.y += STATE.spinVel.y * dt;
                STATE.rotation.x += STATE.spinVel.x * dt;
                if (!STATE.hand.detected) {
                    STATE.spinVel.x *= 0.95;
                    STATE.spinVel.y *= 0.95;
                }
            } else if (STATE.mode === 'FOCUS') {
                _invMatrix.copy(mainGroup.matrixWorld).invert();
            }

            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;

            // 相机缩放（滚轮/双指）
            const targetZ = CONFIG.camera.baseZ * STATE.zoom;
            STATE.zoom += (STATE.zoomTarget - STATE.zoom) * Math.min(1, 6 * dt);
            camera.position.z += (targetZ - camera.position.z) * Math.min(1, 6 * dt);

            // 背景层
            if (galaxySystem && galaxySystem.pts.visible) {
                bgGroup.rotation.y -= 0.05 * dt;
            } else if ((snowSystem && snowSystem.pts.visible) || (heartSystem && heartSystem.pts.visible)) {
                bgGroup.rotation.y -= 0.02 * dt;
            }

            // 尘埃 / 星光：树形⇄散开渐变 + FOCUS 时整体淡出（原版是缩到 0.01）
            const mixT = (STATE.mode === 'TREE') ? 1 : 0;
            [dustSys, sparkleSys].forEach(sys => {
                if (!sys) return;
                const u = sys.mat.uniforms;
                u.uTreeMix.value += (mixT - u.uTreeMix.value) * Math.min(1, 2.2 * dt);
                u.uScatterScale.value = STATE.scatterScale;
                const targetOpacity = sys.baseOpacity * ((STATE.mode === 'FOCUS') ? 0 : 1);
                u.uOpacity.value += (targetOpacity - u.uOpacity.value) * Math.min(1, 6 * dt);
            });

            if (STATE.starMesh) {
                STATE.starMesh.rotation.y -= dt;
                STATE.starMesh.rotation.z = Math.sin(time) * 0.2;
                STATE.starMesh.scale.setScalar(1.0 + Math.sin(time * 2) * 0.1);
            }

            photoParticles.forEach(p => p.update(dt, time, STATE.mode, STATE.focusTarget,
                (STATE.mode === 'FOCUS' ? _invMatrix : null)));

            updateTreeInstances(dt, time);

            composer.render();
            adaptCheck(dt);
        }

        // 记录每个粒子系统的原始透明度，供 FOCUS 淡出使用
        function bakeBaseOpacity() {
            [dustSys, sparkleSys].forEach(sys => { if (sys) sys.baseOpacity = sys.mat.uniforms.uOpacity.value; });
        }

        // 轻量调试/自动化测试钩子（不影响正常使用）
        window.__xtree = { switchTheme, enterLetterMode, exitLetterMode, STATE };

        init();
    </script>
</body>
</html>
